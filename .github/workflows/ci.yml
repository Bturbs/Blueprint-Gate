name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adp
          POSTGRES_USER: adp
          POSTGRES_PASSWORD: adp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://adp:adp@localhost:5432/adp
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: alembic upgrade head
      - run: pytest -q
