control_url: http://127.0.0.1:8000
# For a private HTTPS worker proxy, set an absolute path to its trusted CA PEM.
# control_ca_bundle: /home/worker/.config/blueprint-gate/control-root.crt
worker_token_env: ADP_WORKER_TOKEN
worker_id: my-laptop
untrusted_user: blueprint-agent
untrusted_group: blueprint-work
# In the dedicated VM, require Bubblewrap filesystem confinement for provider
# CLIs and the model verifier. The bootstrap script enables this by default.
# untrusted_sandbox: true
capabilities: [git, codex]
poll_seconds: 5
threat_tool_root: /absolute/path/to/threat-model-tool
repositories:
  example/project:
    path: /absolute/path/to/local/project
    worktrees: /absolute/path/to/adp-worktrees
    # Preload a check image in the VM's own Docker daemon. A local sha256 image ID is accepted.
    check_image: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    threat_root_model: threatModels/Project/Project.yaml
    # For models kept in a separate repository, use this instead of threat_root_model:
    # threat_repository:
    #   full_name: example/threat-models
    #   path: /absolute/path/to/threat-models
    #   worktrees: /absolute/path/to/threat-worktrees
    #   root_model: threatModels/Project/Project.yaml
